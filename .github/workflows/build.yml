name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew --no-daemon build 2>&1 | tee build-output.log

      - name: Surface build log on failure
        if: failure()
        run: |
          # Emit the tail of the Gradle build log as workflow annotations so a
          # failing build can be diagnosed without downloading the full logs.
          if [ -f build-output.log ]; then
            tail -n 200 build-output.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{ printf "%s%%0A", $0 }' > build-output.encoded
            split -b 3000 build-output.encoded build-output.part_
            index=0
            for part in build-output.part_*; do
              index=$((index + 1))
              echo "::error title=Gradle build log (chunk ${index})::$(cat "$part")"
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: renderutil-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
